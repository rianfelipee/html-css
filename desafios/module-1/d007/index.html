<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Imagem Flexífel</title>
</head>
<body>
    <h1>Imagem Flexível</h1>
    <p>
        Você tá vendo a imagem completa? experimente ampliar ou diminuir o tamanho da sua janela para aproveitar melhor a experiência &#x1F92F;
    </p>
    <picture>
        <source media="(max-width: 790px)" srcset="imagens/paisagem-p.png" type="image/png">
        <source media="(max-width: 1250px)" srcset="imagens/paisagem-m.png" type="image/png">
        <img src="imagens/paisagem-g.png" alt="Mulher no topo da montanha com os braços abertos">
    </picture>
</body>
</html>
