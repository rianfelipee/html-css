<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste com Imagens</title>
</head>
<body>
    <h1>Testando carga e Imagens</h1>
    <p> 
        Abaixo você vai ver uma lista de imagens que está na mesma pasta.
    </p>
    <img src="imagens/logo-html.png" alt="Logo HTML5">
    <img src="imagens/logo-css.png" alt="Logo CSS3">
    <img src="imagens/logo-javascript.png" alt="Logo JavaScript">
    <p>
        As imagens podem estar tanto nas pastas do arquivo HTML quanto em sub-pastas.
    </p>
    <p>
        Podemos também usar imagens externas.
    </p>
    <img src="https://cdn-icons-png.flaticon.com/512/6509/6509613.png" alt="Ícone de colchetes angulares e barra HTML: &lt;/&gt;">

</html>
