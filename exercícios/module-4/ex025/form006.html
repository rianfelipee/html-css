<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <form action="cadastro.php" method="post">
        <div>
            <label for="icor">Cor</label>
            <input type="color" name="cor" id="icor">
        </div>
        <div>
            <label for="inivel">Nível de satisfação</label>
            <input type="range" name="nivel" id="inivel" min="1" max="7">
        </div>
        <!--para usar input:file é necessário usar o metodo post-->
        <div>
            <label for="ifoto">Foto do perfil</label><br>
            <input type="file" name="nivel" id="inivel">
        </div>
        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>
    </form>
</body>
</html>
